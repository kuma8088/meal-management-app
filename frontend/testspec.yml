version: 0.1

# Device Farm Test Specification for Meal Management App
# Playwright E2E テストをDevice Farm上で実行する構成

# Android デバイスのテストホスト指定
# Note: iOS テストは削除済み（Web アプリには不要）
# 詳細: docs/99_DeviceFarm_Usecase.md
android_test_host: amazon_linux_2

phases:
  # 準備フェーズ: 依存関係のインストールとPlaywrightブラウザセットアップ
  pre_test:
    commands:
      - echo "Installing Node.js dependencies..."
      - npm ci
      - echo "Installing Playwright browsers..."
      - npx playwright install chromium
      - echo "Setup completed successfully"

  # テスト実行フェーズ: スモークテストのみ実行（5テスト、10分以内目標）
  # デプロイ済みCloudFront URLに対してテストを実行
  test:
    commands:
      - echo "Starting Playwright smoke tests on Device Farm..."
      - echo "Testing against deployed CloudFront URL..."
      - echo "Running 5 essential tests for quick validation..."
      - npx playwright test e2e/smoke-test.spec.ts --config=playwright.devicefarm.config.ts --project=chromium --timeout=60000
    finally:
      - echo "Smoke test completed"

  # クリーンアップフェーズ: テストアーティファクトの収集
  post_test:
    commands:
      - echo "Collecting test results and artifacts..."
      - test -d playwright-report && zip -r test-results.zip playwright-report || echo "No test reports found"
      - test -d test-results && zip -r test-results-json.zip test-results || echo "No JSON results found"

# アーティファクト設定 - Device Farm形式（シンプルなパス配列）
artifacts:
  - $DEVICEFARM_LOG_DIR
  - playwright-report
  - test-results
