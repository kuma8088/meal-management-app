name: Device Farm E2E Tests

on:
  # PRがオープン、同期、または再オープンされた時にトリガー
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'
      - '.github/workflows/device-farm.yml'

  # 毎週日曜日 9:00 UTC（日本時間 18:00）に定期実行
  schedule:
    - cron: '0 9 * * 0'

  # 手動トリガー
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  DEVICEFARM_PROJECT_NAME: meal-management-app-e2e-tests-dev
  ARTIFACT_BUCKET: meal-management-app-test-artifacts-dev

jobs:
  build-and-upload:
    name: Build App & Upload to Device Farm
    runs-on: ubuntu-latest

    outputs:
      testpackage-upload-arn: ${{ steps.upload-package.outputs.testpackage_upload_arn }}
      testspec-upload-arn: ${{ steps.upload-spec.outputs.testspec_upload_arn }}
      project-arn: ${{ steps.project.outputs.project_arn }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install chromium --with-deps

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Device Farm Project ARN
        id: project
        run: |
          # Get project ARN from project name
          PROJECT_ARN=$(aws devicefarm list-projects \
            --query "projects[?name=='${{ env.DEVICEFARM_PROJECT_NAME }}'].arn" \
            --output text \
            --region ${{ env.AWS_REGION }})

          echo "project_arn=$PROJECT_ARN" >> $GITHUB_OUTPUT
          echo "Project ARN: $PROJECT_ARN"

      - name: Create test package ZIP
        working-directory: ./frontend
        run: |
          # Create a ZIP file containing the test code
          # Include: e2e tests, package.json, node_modules, playwright config
          mkdir -p test-package
          cp -r e2e test-package/
          cp package.json test-package/
          cp package-lock.json test-package/
          cp playwright.config.ts test-package/
          cp tsconfig.json test-package/
          cp -r node_modules test-package/

          cd test-package
          zip -r ../test-package.zip .
          cd ..

          echo "Test package created:"
          ls -lh test-package.zip

      - name: Upload test package to Device Farm
        id: upload-package
        working-directory: ./frontend
        run: |
          # Create upload for test package
          UPLOAD_RESPONSE=$(aws devicefarm create-upload \
            --project-arn "${{ steps.project.outputs.project_arn }}" \
            --name "test-package-$(date +%s).zip" \
            --type "APPIUM_WEB_NODE_TEST_PACKAGE" \
            --region ${{ env.AWS_REGION }})

          TESTPACKAGE_UPLOAD_ARN=$(echo "$UPLOAD_RESPONSE" | jq -r '.upload.arn')
          UPLOAD_URL=$(echo "$UPLOAD_RESPONSE" | jq -r '.upload.url')

          echo "testpackage_upload_arn=$TESTPACKAGE_UPLOAD_ARN" >> $GITHUB_OUTPUT
          echo "Test Package Upload ARN: $TESTPACKAGE_UPLOAD_ARN"

          # Upload the test package ZIP
          curl -X PUT "$UPLOAD_URL" \
            -H "Content-Type: application/zip" \
            --data-binary "@test-package.zip"

          # Wait for upload to complete
          echo "Waiting for upload to be processed..."
          for i in {1..30}; do
            STATUS=$(aws devicefarm get-upload \
              --arn "$TESTPACKAGE_UPLOAD_ARN" \
              --query 'upload.status' \
              --output text \
              --region ${{ env.AWS_REGION }})

            echo "Upload status: $STATUS"

            if [ "$STATUS" = "SUCCEEDED" ]; then
              echo "Test package upload succeeded!"
              break
            elif [ "$STATUS" = "FAILED" ]; then
              echo "Test package upload failed!"
              aws devicefarm get-upload --arn "$TESTPACKAGE_UPLOAD_ARN" --region ${{ env.AWS_REGION }}
              exit 1
            fi

            sleep 10
          done

      - name: Upload testspec to Device Farm
        id: upload-spec
        working-directory: ./frontend
        run: |
          # Create upload for test specification
          UPLOAD_RESPONSE=$(aws devicefarm create-upload \
            --project-arn "${{ steps.project.outputs.project_arn }}" \
            --name "testspec-$(date +%s).yml" \
            --type "APPIUM_WEB_NODE_TEST_SPEC" \
            --region ${{ env.AWS_REGION }})

          TESTSPEC_UPLOAD_ARN=$(echo "$UPLOAD_RESPONSE" | jq -r '.upload.arn')
          UPLOAD_URL=$(echo "$UPLOAD_RESPONSE" | jq -r '.upload.url')

          echo "testspec_upload_arn=$TESTSPEC_UPLOAD_ARN" >> $GITHUB_OUTPUT
          echo "Test Spec Upload ARN: $TESTSPEC_UPLOAD_ARN"

          # Upload the testspec YAML
          curl -X PUT "$UPLOAD_URL" \
            -H "Content-Type: text/yaml" \
            --data-binary "@testspec.yml"

          # Wait for upload to complete
          echo "Waiting for upload to be processed..."
          for i in {1..30}; do
            STATUS=$(aws devicefarm get-upload \
              --arn "$TESTSPEC_UPLOAD_ARN" \
              --query 'upload.status' \
              --output text \
              --region ${{ env.AWS_REGION }})

            echo "Upload status: $STATUS"

            if [ "$STATUS" = "SUCCEEDED" ]; then
              echo "Test spec upload succeeded!"
              break
            elif [ "$STATUS" = "FAILED" ]; then
              echo "Test spec upload failed!"
              aws devicefarm get-upload --arn "$TESTSPEC_UPLOAD_ARN" --region ${{ env.AWS_REGION }}
              exit 1
            fi

            sleep 5
          done

  run-tests:
    name: Run E2E Tests on Device Farm
    runs-on: ubuntu-latest
    needs: build-and-upload

    strategy:
      matrix:
        device-pool: [android, ios]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Device Pool ARN - ${{ matrix.device-pool }}
        id: get-pool
        run: |
          PROJECT_ARN="${{ needs.build-and-upload.outputs.project-arn }}"
          echo "project_arn=$PROJECT_ARN" >> $GITHUB_OUTPUT
          echo "Project ARN: $PROJECT_ARN"

          # Get device pool ARN
          if [ "${{ matrix.device-pool }}" = "android" ]; then
            POOL_NAME="meal-management-app-android-pool-dev"
          else
            POOL_NAME="meal-management-app-ios-pool-dev"
          fi

          POOL_ARN=$(aws devicefarm list-device-pools \
            --arn "$PROJECT_ARN" \
            --query "devicePools[?name=='$POOL_NAME'].arn" \
            --output text \
            --region ${{ env.AWS_REGION }})

          echo "pool_arn=$POOL_ARN" >> $GITHUB_OUTPUT
          echo "Device Pool ARN: $POOL_ARN"

      - name: Create test run - ${{ matrix.device-pool }}
        id: test-run
        run: |
          PROJECT_ARN="${{ needs.build-and-upload.outputs.project-arn }}"
          DEVICE_POOL_ARN="${{ steps.get-pool.outputs.pool_arn }}"
          TESTPACKAGE_ARN="${{ needs.build-and-upload.outputs.testpackage-upload-arn }}"
          TESTSPEC_ARN="${{ needs.build-and-upload.outputs.testspec-upload-arn }}"

          echo "Scheduling test run with:"
          echo "  Project ARN: $PROJECT_ARN"
          echo "  Device Pool ARN: $DEVICE_POOL_ARN"
          echo "  Test Package ARN: $TESTPACKAGE_ARN"
          echo "  Test Spec ARN: $TESTSPEC_ARN"

          TEST_RUN_ARN=$(aws devicefarm schedule-run \
            --project-arn "$PROJECT_ARN" \
            --device-pool-arn "$DEVICE_POOL_ARN" \
            --test "{\"type\":\"APPIUM_WEB_NODE\",\"testPackageArn\":\"$TESTPACKAGE_ARN\",\"testSpecArn\":\"$TESTSPEC_ARN\"}" \
            --execution-configuration '{"accountsCleanup":true,"appPackagesCleanup":true,"videoCapture":true}' \
            --query 'run.arn' \
            --output text \
            --region ${{ env.AWS_REGION }})

          echo "test_run_arn=$TEST_RUN_ARN" >> $GITHUB_OUTPUT
          echo "Test Run ARN: $TEST_RUN_ARN"

      - name: Wait for test completion - ${{ matrix.device-pool }}
        id: wait-tests
        timeout-minutes: 60
        run: |
          TEST_RUN_ARN="${{ steps.test-run.outputs.test_run_arn }}"
          MAX_ATTEMPTS=180
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            STATUS=$(aws devicefarm get-run \
              --arn "$TEST_RUN_ARN" \
              --query 'run.status' \
              --output text \
              --region ${{ env.AWS_REGION }})

            echo "Test run status: $STATUS (Attempt $((ATTEMPT+1))/$MAX_ATTEMPTS)"

            if [ "$STATUS" = "COMPLETED" ]; then
              RESULT=$(aws devicefarm get-run \
                --arn "$TEST_RUN_ARN" \
                --query 'run.result' \
                --output text \
                --region ${{ env.AWS_REGION }})

              echo "Test result: $RESULT"
              echo "test_result=$RESULT" >> $GITHUB_OUTPUT
              break
            fi

            ATTEMPT=$((ATTEMPT+1))
            sleep 20
          done

          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "Test run timeout"
            exit 1
          fi

      - name: Download test artifacts - ${{ matrix.device-pool }}
        if: always()
        run: |
          TEST_RUN_ARN="${{ steps.test-run.outputs.test_run_arn }}"

          if [ -z "$TEST_RUN_ARN" ]; then
            echo "No test run ARN available, skipping artifact download"
            exit 0
          fi

          aws devicefarm list-artifacts \
            --arn "$TEST_RUN_ARN" \
            --type "LOG" \
            --query 'artifacts[*].[name,url]' \
            --output text \
            --region ${{ env.AWS_REGION }} | while read name url; do
              if [ ! -z "$name" ] && [ ! -z "$url" ]; then
                echo "Downloading artifact: $name"
                curl -o "$name" "$url" 2>/dev/null || echo "Failed to download $name"
              fi
            done

      - name: Upload test artifacts to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-farm-results-${{ matrix.device-pool }}
          path: |
            *.xml
            *.json
            *.log
          retention-days: 30
          if-no-files-found: ignore

  report-results:
    name: Report Test Results
    runs-on: ubuntu-latest
    needs: run-tests
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true

      - name: Generate test report summary
        run: |
          echo "# Device Farm E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow Run**: [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # アーティファクト情報を表示
          echo "## Test Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -la device-farm-results-* 2>/dev/null | while read line; do
            echo "- $line" >> $GITHUB_STEP_SUMMARY
          done || echo "No test artifacts found" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Device Farm E2E tests completed. See [test results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })
